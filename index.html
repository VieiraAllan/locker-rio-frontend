<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffcc32" />
    <meta name="application-name" content="Locker Rio Admin" />
    <meta name="apple-mobile-web-app-title" content="Locker Rio" />

    <!-- (Opcional, mas recomendado) -->
    <meta
      name="description"
      content="Painel administrativo do Locker Rio"
    />

    <!-- Título do navegador -->
    <title>Locker Rio</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- PWA -->
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <script>
      (function () {
        var erros = [];
        window.onerror = function (msg, src, linha, coluna) {
          erros.push(String(msg) + ' (' + String(src).split('/').pop() + ':' + linha + ':' + coluna + ')');
        };
        window.addEventListener('load', function () {
          setTimeout(function () {
            var root = document.getElementById('root');
            if (!/[?&]diagnostico=1(&|$)/.test(window.location.search)) return;
            if (!root || root.childNodes.length > 0) return;
            var caixa = document.createElement('div');
            caixa.setAttribute('style', 'margin:24px 16px;padding:16px;background:#fff;color:#222;font:14px sans-serif;border-radius:12px;word-wrap:break-word');
            caixa.appendChild(document.createTextNode(
              'Não foi possível carregar a página neste navegador. Envie um print desta tela para o suporte. ' +
              (erros.length ? 'Erro: ' + erros.join(' | ') : 'Nenhum erro registrado.') +
              ' Navegador: ' + navigator.userAgent
            ));
            document.body.insertBefore(caixa, document.body.firstChild);
          }, 5000);
        });
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
